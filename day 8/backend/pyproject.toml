[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day8-backend"
version = "1.0.0"
description = "Day 8 Voice Agent Performance Dashboard & Agent (Local Commerce Track)"
requires-python = ">=3.10, <3.15"

dependencies = [
    "fastapi>=0.141.1",
    "livekit-agents[deepgram,google,silero,turn-detector]~=1.4",
    "livekit-murf>=0.1.1",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 88
target-version = "py39"
